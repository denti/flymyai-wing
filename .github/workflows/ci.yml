name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 6 * * 1'          # weekly macos-26 canary
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: Lidwing
  BUNDLE_ID: ai.flymy.lidwing
  MACOS_MIN: '12.0'

jobs:
  # Fast feedback on the portable half. This is the loop the developer actually lives in:
  # it needs no macOS runner and it is where every unit test lives.
  core-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Swift version
        run: swift --version
      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors 2>&1 | tee build.log
      - name: Unit tests
        run: swift test 2>&1 | tee linux-test.log
      - name: Assert the tests actually ran
        # An empty result is a red result. A suite that collected zero tests has proved
        # nothing, and a pipeline that reads "no failures" from silence is how a green board
        # ends up meaning nothing.
        shell: bash          # the swift:6.0 image's /bin/sh is dash: no `set -o pipefail`
        run: |
          set -euo pipefail
          grep -Eq 'Executed [0-9]+ tests' linux-test.log
          # The LAST line is the whole-run total; the first is only the first suite.
          COUNT=$(grep -Eo 'Executed [0-9]+ tests' linux-test.log | tail -1 | grep -Eo '[0-9]+')
          echo "collected $COUNT tests"
          test "$COUNT" -ge 40
      # The hook helper's contract is about timing and exit codes, which no Swift test can
      # check. It is plain POSIX C, so it runs here rather than waiting for a macOS runner.
      - name: Notify-helper behaviour
        shell: bash
        timeout-minutes: 3
        run: ./Scripts/test-notify-helper.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: linux-test-log
          path: linux-test.log

  # The shell scripts run on a user's Mac, where nobody can debug them. macOS ships bash 3.2.
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -S warning Scripts/*.sh spike/*.sh

  # LidwingCore must stay portable: the moment it imports AppKit or IOKit, the whole
  # Linux-testable architecture is gone and nobody notices until the next Linux build breaks.
  core-purity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: LidwingCore imports nothing platform-specific
        run: ./Scripts/check-core-purity.sh
      # The build script and the runtime name the same files in different places. A rename on
      # one side ships an app with no watchdog, which launches and looks entirely normal.
      - name: The bundle contains what the app looks for
        run: ./Scripts/check-bundle-contract.sh

  test-macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - name: Select the pinned toolchain
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "Xcode 16.4 is not on this image; using the default and recording it."
            ls -d /Applications/Xcode*.app || true
          fi
      - run: swift --version && xcodebuild -version && sw_vers
      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Unit tests
        run: swift test 2>&1 | tee macos-test.log
      # Also run on macOS: this is the platform the helper actually ships to, and the timing
      # budget is about a real user's agent rather than a container.
      - name: Notify-helper behaviour
        timeout-minutes: 3
        run: ./Scripts/test-notify-helper.sh
      - name: Assert the tests actually ran
        run: |
          set -euo pipefail
          COUNT=$(grep -Eo 'Executed [0-9]+ tests' macos-test.log | tail -1 | grep -Eo '[0-9]+')
          echo "collected $COUNT tests"
          test "$COUNT" -ge 40
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: macos-test-log
          path: macos-test.log

  lint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: SwiftLint
        run: |
          set -euo pipefail
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint --version
          swiftlint lint --strict --reporter github-actions-logging

  # Early warning for the next macOS. When this turns red, the migration is a two-line change
  # and we find out before a user does.
  #
  # Deliberately NOT `continue-on-error`. That flag makes the job report success whatever its
  # steps did, which is the "empty result reads as a pass" failure mode this project treats as
  # a bug. It is kept out of the required-checks list in branch protection instead, so a red
  # canary is visible without blocking a merge.
  canary-26:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - run: xcodebuild -version && sw_vers
      - run: swift build -c release 2>&1 | tail -40
      - run: swift test 2>&1 | tail -40

  # Everything a user actually downloads: the universal binaries, the .app, the signature and
  # the artifact invariants. Ad-hoc signed until a Developer ID secret exists; the same script
  # takes the real identity the moment one does, with no rewrite.
  build:
    runs-on: macos-15
    timeout-minutes: 30
    needs: [test-macos, lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - name: Select the pinned toolchain
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
      - name: Build universal and assemble the app
        run: ./Scripts/build.sh
      # `secrets` is not an allowed context in a step `if` — GitHub rejects the whole
      # workflow, producing a run with zero jobs and a red tick that names nothing. The secret
      # is lifted into `env` first, and `env` is allowed.
      - name: Import Developer ID (absent secret falls back to ad-hoc)
        id: cert
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          PASSWORD="$(openssl rand -hex 20)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" \
            "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "have_cert=true" >> "$GITHUB_OUTPUT"
      - name: Sign
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./Scripts/sign.sh "${SIGN_ID:--}"
      - name: Notarize and staple
        if: steps.cert.outputs.have_cert == 'true'
        env:
          AC_KEY: ${{ secrets.AC_API_KEY_P8 }}
          AC_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_ISSUER: ${{ secrets.AC_API_ISSUER_ID }}
        run: ./Scripts/notarize.sh
      - name: Package
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./Scripts/package.sh
      - name: Artifact invariants
        run: ./Scripts/invariants.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14
